<title>한자 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 레이아웃: 태블릿 한 화면 = 한 가지 놀이. 큼직한 버튼, 위에서 아래로 한 줄 흐름 */
:root{
  --sky:#DCEDFC; --sky2:#BED9F3; --ink:#1D2A48; --ink2:#56658A;
  --seal:#D93A2B; --sun:#FFC12E; --leaf:#22A065; --grape:#6E56D8; --peach:#FF8C5A;
  --paper:#FFFFFF; --mist:#D3E1EF; --soft:#F2F8FE; --goodbg:#DDF5E7; --badbg:#FDE4E0;
  --f-display:'Jua','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Gowun Dodum',system-ui,sans-serif;
  --f-han:'Noto Serif KR','Batang','AppleMyungjo','Nanum Myeongjo',serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:18px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
#app{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:8px 40px}
.han{font-family:var(--f-han);font-weight:900}

/* 상단 바 */
.bar{display:flex;align-items:center;gap:12px;min-height:72px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--sky);z-index:5}
.bar h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4vw,32px);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:60px;height:60px;border-radius:20px;border:0;background:var(--paper);font-size:30px;box-shadow:0 5px 0 var(--sky2)}
.back:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sky2)}
.starchip{background:var(--paper);border-radius:999px;padding:8px 18px;font-family:var(--f-display);font-size:26px;box-shadow:0 5px 0 var(--sky2);font-variant-numeric:tabular-nums;white-space:nowrap}
.starchip.pop{animation:pop .45s}

/* 공통 버튼 */
.btn{border:0;border-radius:22px;padding:14px 24px;font-family:var(--f-display);font-size:24px;background:var(--paper);box-shadow:0 6px 0 rgba(29,42,72,.18);min-height:64px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(29,42,72,.18)}
.btn.sun{background:var(--sun)} .btn.leaf{background:var(--leaf);color:#fff} .btn.grape{background:var(--grape);color:#fff} .btn.seal{background:var(--seal);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.panel{background:var(--paper);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--sky2)}
.small{font-size:15px;color:var(--ink2)}

/* 홈 */
#scr-home{display:grid;gap:18px}
.hero{display:flex;gap:18px;align-items:center}
.avatar{width:110px;height:110px;flex:none;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:64px;box-shadow:0 6px 0 #E3A400}
.hero-txt{flex:1;min-width:0}
.hello{font-family:var(--f-display);font-size:clamp(28px,5vw,40px);margin:0}
.rank{margin:2px 0 10px;font-size:18px;color:var(--ink2)}
.meter{height:18px;border-radius:99px;background:var(--mist);overflow:hidden}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--peach));border-radius:99px;transition:width .6s}
.levels{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.lv{flex:none;border:0;border-radius:18px;padding:10px 18px;background:var(--paper);font-family:var(--f-display);font-size:22px;box-shadow:0 5px 0 var(--sky2);min-height:56px}
.lv.on{background:var(--ink);color:#fff;box-shadow:0 5px 0 #0c1428}
.lv.lock{opacity:.55}
.lv small{display:block;font-family:var(--f-body);font-size:12px;opacity:.8}
.mission h2,.collection h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 10px}
.mlist{display:grid;gap:8px}
.mitem{display:flex;align-items:center;gap:12px;font-size:19px}
.mitem .chk{width:34px;height:34px;border-radius:50%;border:3px solid var(--mist);display:grid;place-items:center;font-size:18px;flex:none}
.mitem.done .chk{background:var(--leaf);border-color:var(--leaf);color:#fff}
.mitem.done span.t{text-decoration:line-through;color:var(--ink2)}
.mitem b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.mode{border:0;border-radius:30px;min-height:160px;padding:18px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 0 var(--c,var(--sky2));position:relative;overflow:hidden}
.mode:active{transform:translateY(5px);box-shadow:0 3px 0 var(--c,var(--sky2))}
.mode .ic{font-size:58px;line-height:1}
.mode .nm{font-family:var(--f-display);font-size:28px}
.mode .ds{font-size:15px;color:var(--ink2)}
.mode::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:var(--c)}
.monrow{display:flex;flex-wrap:wrap;gap:8px;font-size:40px}
.monrow .empty{font-size:16px;color:var(--ink2)}
.parentBtn{justify-self:center;border:0;background:transparent;color:var(--ink2);font-size:15px;padding:12px 18px;border-radius:14px;position:relative;overflow:hidden}
.parentBtn .fill{position:absolute;inset:0;background:var(--sky2);transform:scaleX(0);transform-origin:left;z-index:-1}
.parentBtn.hold .fill{transform:scaleX(1);transition:transform 1.5s linear}

/* 카드 탐험 */
.lvhead{font-family:var(--f-display);font-size:24px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.lvhead .small{font-family:var(--f-body)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.lcard{border:0;border-radius:24px;background:var(--paper);padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 var(--sky2);position:relative}
.lcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky2)}
.lpic{font-size:28px;height:34px;line-height:34px}
.lhan{font-family:var(--f-han);font-weight:900;font-size:58px;line-height:1.15}
.lhe{font-size:16px;color:var(--ink2)}
.sticker{position:absolute;top:-8px;right:-6px;font-size:26px;transform:rotate(14deg)}
.lcard.seen{background:linear-gradient(180deg,#FFF8DF,var(--paper) 40%)}

/* 모달 */
#modal{position:fixed;inset:0;background:rgba(20,30,55,.55);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--paper);border-radius:34px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:26px 22px 24px;text-align:center;position:relative;animation:rise .3s}
.mclose{position:absolute;top:12px;right:12px;width:52px;height:52px;border-radius:50%;border:0;background:var(--soft);font-size:26px}
.mpic{font-size:56px;line-height:1.1}
.bighan{font-family:var(--f-han);font-weight:900;font-size:clamp(110px,24vw,170px);line-height:1.1}
.mhe{font-family:var(--f-display);font-size:40px}
.story{font-size:20px;line-height:1.6;margin:10px auto 14px;max-width:30em;color:var(--ink2)}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.wchip{border:2px solid var(--mist);background:var(--soft);border-radius:16px;padding:8px 14px;font-size:18px}
.wchip b{font-family:var(--f-han);font-size:24px;margin-right:4px}
.nameform{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px}
#nameIn{font:inherit;font-family:var(--f-display);font-size:30px;padding:10px 16px;border-radius:18px;border:3px solid var(--mist);width:min(260px,100%);text-align:center;color:var(--ink);background:var(--soft);-webkit-user-select:text;user-select:text}
#nameIn:focus{outline:none;border-color:var(--grape)}
.result-big{font-size:80px;line-height:1.1}
.result-title{font-family:var(--f-display);font-size:34px;margin:6px 0}

/* 한자 동화책 */
#book{position:fixed;inset:0;z-index:55;background:rgba(20,30,55,.6);display:grid;place-items:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bk-inner{width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
.bk-top{display:flex;align-items:center;gap:10px}
.bk-title{flex:1;font-family:var(--f-display);font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.bk-top .mclose{position:static;flex:none}
.bk-page{background:#FFFCF3;border-radius:22px 22px 26px 26px;padding:14px;box-shadow:0 10px 0 #E7DCC2,0 14px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;touch-action:pan-y;
  background-image:linear-gradient(90deg,rgba(160,120,60,.06),transparent 6%,transparent 94%,rgba(160,120,60,.06))}
.bk-art{position:relative;border-radius:16px;overflow:hidden;border:3px solid #E7DCC2;aspect-ratio:5/3;flex:none;background:#fff}
.bk-svg{display:block;width:100%;height:100%;transition:filter .6s}
.bk-svg.dim{filter:saturate(.7) brightness(.75) blur(1.5px)}
.bk-ghost path{fill:rgba(255,255,255,.88);stroke:#1D2A48;stroke-width:16;stroke-linejoin:round}
.bk-ghost{animation:ghost 2.2s .4s ease-out both}
.bk-reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.bk-wr{width:min(44%,190px);aspect-ratio:1/1;background:#FFFFFF;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.25);
  background-image:linear-gradient(#F0D9D6,#F0D9D6),linear-gradient(#F0D9D6,#F0D9D6);background-size:100% 1.5px,1.5px 100%;background-position:center;background-repeat:no-repeat}
.bk-he{font-family:var(--f-display);font-size:clamp(26px,5vw,36px);color:#fff;background:var(--seal);padding:4px 18px;border-radius:99px;opacity:0;transform:scale(.6);transition:all .4s cubic-bezier(.2,1.4,.4,1)}
.bk-he.on{opacity:1;transform:none}
.bk-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#FFFFFF,#FFF3DA)}
.bk-text{padding:0 6px 4px;display:grid;gap:10px}
.bk-step{justify-self:start;font-family:var(--f-display);font-size:16px;color:#8A5A2B;background:#F6E7CF;border-radius:99px;padding:3px 12px}
.bk-text p{margin:0;font-family:'Gowun Batang',var(--f-han);font-size:clamp(20px,3.4vw,25px);line-height:1.75;color:#2A2A35;word-break:keep-all}
.bk-text p.drop::first-letter{font-family:var(--f-display);font-size:2.1em;float:left;line-height:1;margin:4px 8px 0 0;color:var(--seal)}
.bk-nav{display:flex;align-items:center;gap:10px}
.bk-nav .btn{min-width:64px;font-size:26px;padding:10px 16px}
.bk-nav .btn:disabled{opacity:.35}
.bk-dots{flex:1;display:flex;justify-content:center;gap:10px}
.bk-dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.5)}
.bk-dots i.on{background:#fff;transform:scale(1.25)}
.sc-drift{animation:drift 14s ease-in-out infinite alternate}
.sc-twinkle{animation:twinkle 1.6s ease-in-out infinite alternate}
.sc-glow{animation:twinkle 2.4s ease-in-out infinite alternate}
.sc-flow{stroke-dasharray:12 20;animation:flow 1.6s linear infinite}
.sc-wave{animation:wave 3s ease-in-out infinite alternate}
.sc-bob{animation:hop 2.4s ease-in-out infinite}
.sc-flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .45s ease-in-out infinite alternate}
.sc-rain{animation:rain .7s linear infinite}
.sc-bolt{animation:bolt 3.2s infinite}
.sc-spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.sc-flag{transform-box:fill-box;transform-origin:left center;animation:cape 1.2s ease-in-out infinite}
@keyframes ghost{from{opacity:0}to{opacity:1}}
@keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-64}}
@keyframes wave{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
@keyframes flicker{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}
@keyframes rain{from{transform:translate(0,-20px)}to{transform:translate(-6px,20px)}}
@keyframes bolt{0%,62%,70%,100%{opacity:0}64%,68%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 퀴즈 */
.arena{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#3B2F86,var(--grape));color:#fff;border-radius:28px;padding:14px 20px;box-shadow:0 6px 0 #2A2163}
.monster{font-size:76px;line-height:1;display:inline-block}
.monster.hit{animation:hit .5s}
.arena-info{flex:1;min-width:0}
.monname{font-family:var(--f-display);font-size:24px}
.hp{display:flex;gap:4px;margin-top:8px}
.hp i{flex:1;height:16px;border-radius:5px;background:rgba(255,255,255,.2)}
.hp i.on{background:var(--peach)}
.qnum{font-family:var(--f-display);font-size:22px;opacity:.85;white-space:nowrap}
.prompt{background:var(--paper);border-radius:30px;padding:18px;margin:16px 0;text-align:center;position:relative;box-shadow:0 6px 0 var(--sky2)}
.tag{display:inline-block;background:var(--soft);border-radius:99px;padding:4px 14px;font-size:16px;color:var(--ink2)}
.bigword{font-family:var(--f-han);font-weight:900;font-size:clamp(64px,14vw,110px);line-height:1.2;letter-spacing:.06em}
.bighe{font-family:var(--f-display);font-size:clamp(48px,10vw,76px);padding:16px 0}
.sayq{position:absolute;top:12px;right:12px;width:60px;height:60px;border-radius:50%;border:0;background:var(--sun);font-size:28px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border:4px solid transparent;border-radius:26px;background:var(--paper);min-height:100px;font-family:var(--f-display);font-size:clamp(24px,4.4vw,34px);box-shadow:0 6px 0 var(--sky2);padding:10px}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky2)}
.opt.han{font-family:var(--f-han);font-weight:900;font-size:clamp(52px,10vw,72px)}
.opt.right{background:var(--goodbg);border-color:var(--leaf)}
.opt.wrong{background:var(--badbg);color:#B03A2E;animation:shake .4s;opacity:.7}
.opt .no{font-family:var(--f-body);font-size:20px;color:var(--ink2);margin-right:6px}
.cheer{text-align:center;font-family:var(--f-display);font-size:26px;min-height:40px;margin-top:12px}
.strokesvg{width:min(240px,60vw);height:auto;background:
  linear-gradient(var(--mist),var(--mist)) center/100% 2px no-repeat,
  linear-gradient(var(--mist),var(--mist)) center/2px 100% no-repeat;border:3px solid var(--mist);border-radius:16px}

/* 짝 맞추기 */
.mtop{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:24px;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mcard{border:0;padding:0;aspect-ratio:1/1;border-radius:22px;perspective:600px;background:transparent;max-width:100%}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in,.mcard.ok .in{transform:rotateY(180deg)}
.mcard .bk,.mcard .fc{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .bk{background:var(--grape);color:#fff;font-family:var(--f-han);font-size:clamp(28px,6vw,44px);box-shadow:0 6px 0 #4B37A8;
  background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.5px);background-size:18px 18px}
.mcard .fc{background:var(--paper);transform:rotateY(180deg);box-shadow:0 6px 0 var(--sky2);padding:6px;text-align:center}
.mcard .fc.h{font-family:var(--f-han);font-weight:900;font-size:clamp(44px,10vw,76px)}
.mcard .fc.m{font-family:var(--f-display);font-size:clamp(16px,3.4vw,26px);line-height:1.25}
.mcard .fc.m .e{font-size:clamp(26px,5vw,40px)}
.mcard.ok .fc{background:var(--goodbg)}

/* 따라 쓰기 */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
.sch{flex:none;width:64px;height:76px;border:0;border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--sky2);font-family:var(--f-han);font-weight:900;font-size:32px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.sch small{font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--seal);letter-spacing:-1px;min-height:13px}
.sch.cur{background:var(--ink);color:#fff}
.wwrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;margin-top:6px}
.wbox{width:min(360px,100%);aspect-ratio:1/1;background:var(--paper);border-radius:28px;box-shadow:0 6px 0 var(--sky2);position:relative;overflow:hidden;
  background-image:
    linear-gradient(var(--mist),var(--mist)),linear-gradient(var(--mist),var(--mist));
  background-size:100% 2px,2px 100%;background-position:center,center;background-repeat:no-repeat}
.wbox svg{position:relative}
.winfo{text-align:center;display:grid;gap:12px;justify-items:center}
.winfo .han{font-size:72px;line-height:1}
.winfo .he{font-family:var(--f-display);font-size:32px}
.winfo .st{font-size:28px;min-height:36px}

/* 시험 */
.eprog{height:14px;border-radius:99px;background:var(--mist);overflow:hidden;margin-bottom:10px}
.eprog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.esec{font-size:20px;font-weight:700;margin-top:8px}
.stamp{width:180px;height:180px;margin:6px auto;border:8px solid var(--seal);border-radius:50%;display:grid;place-items:center;color:var(--seal);font-family:var(--f-han);font-weight:900;font-size:56px;transform:rotate(-12deg);animation:stamp .5s}
.stamp.fail{border-color:var(--ink2);color:var(--ink2);font-family:var(--f-display);font-size:34px;font-weight:400}
.review{text-align:left;display:grid;gap:8px;margin:14px 0}
.review div{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:18px}
.review b{font-family:var(--f-han);font-size:24px;margin-right:8px}

/* 부모님 */
#scr-parent{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--paper);border-radius:20px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}
.ptable{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pc{background:var(--soft);border-radius:14px;padding:8px;text-align:center;border-bottom:5px solid var(--mist)}
.pc .han{font-size:30px;display:block}
.pc span{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pc.good{border-color:var(--leaf)} .pc.mid{border-color:var(--sun)} .pc.bad{border-color:var(--seal);background:var(--badbg)}
.ptxt{font-size:16px;line-height:1.7;color:var(--ink2)}
.ptxt h3{color:var(--ink);font-size:18px;margin:12px 0 4px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;font-family:var(--f-display);font-size:24px;padding:14px 26px;border-radius:99px;transition:transform .3s;z-index:60;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-60px;font-size:34px;z-index:70;pointer-events:none;animation:fall 1.8s ease-in forwards}

/* 한자 모험: 지도 */
.mode.big{grid-column:1/-1;flex-direction:row;gap:20px;min-height:130px;background:linear-gradient(135deg,#3B2F86,var(--grape));color:#fff;box-shadow:0 8px 0 #2A2163}
.mode.big::before{display:none}
.mode.big:active{box-shadow:0 3px 0 #2A2163}
.mode.big .ic{font-size:72px}
.mode.big .ds{color:rgba(255,255,255,.85)}

function env(g,t,peak,att,dec){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+att+dec); }
function noise(){ const a=AC(); if(noise.b)return noise.b; const b=a.createBuffer(1,a.sampleRate,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; return noise.b=b; }
function whoosh(vol=.4,dur=.2){ const a=AC(); if(!a)return; const t=a.currentTime, s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=noise(); f.type='bandpass'; f.Q.value=1.4; f.frequency.setValueAtTime(400,t); f.frequency.exponentialRampToValueAtTime(3600,t+dur*.55); f.frequency.exponentialRampToValueAtTime(700,t+dur);
  env(g,t,vol,dur*.5,dur*.5); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t+dur+.05); }
function boom(vol=.5,f0=130,dur=.3){ const a=AC(); if(!a)return; const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(38,t+dur); env(g,t,vol,.008,dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05); }
function growl(dur=.45,vol=.3){ const a=AC(); if(!a)return; const t=a.currentTime, o=a.createOscillator(), l=a.createOscillator(), lg=a.createGain(), f=a.createBiquadFilter(), g=a.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(95,t); o.frequency.linearRampToValueAtTime(70,t+dur); l.frequency.value=17; lg.gain.value=18; l.connect(lg); lg.connect(o.frequency);
  f.type='lowpass'; f.frequency.value=520; f.Q.value=6; env(g,t,vol,dur*.25,dur*.75); o.connect(f); f.connect(g); g.connect(a.destination);
  const n=a.createBufferSource(), nf=a.createBiquadFilter(), ng=a.createGain(); n.buffer=noise(); nf.type='bandpass'; nf.frequency.value=380; nf.Q.value=1.5; env(ng,t,vol*.6,dur*.2,dur*.8); n.connect(nf); nf.connect(ng); ng.connect(a.destination);
  [o,l,n].forEach(x=>{x.start(t);x.stop(t+dur+.05)}); }
function poof(){ const a=AC(); if(!a)return; const t=a.currentTime, s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=noise(); f.type='lowpass'; f.frequency.setValueAtTime(2400,t); f.frequency.exponentialRampToValueAtTime(160,t+.45); env(g,t,.5,.01,.45); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t+.5); }
function bell(freqs,vol=.16,gap=.09,dec=.7){ const a=AC(); if(!a)return; const t0=a.currentTime;
  freqs.forEach((fr,i)=>{ const t=t0+i*gap; [[1,1],[2.76,.35],[5.4,.12]].forEach(([m,v])=>{ const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=fr*m; env(g,t,vol*v,.004,dec/m**.3); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dec+.1); }); }); }
function sparkle(){ bell([1568,2093,2637,3136],.08,.05,.5); }
function tone(fs,dur=.12,type='triangle',vol=.22){ const a=AC(); if(!a)return; const t=a.currentTime;
  fs.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;env(g,t+i*dur,vol,.02,dur);o.connect(g);g.connect(a.destination);o.start(t+i*dur);o.stop(t+(i+1)*dur+.05)}); }

const VO={packs:{},loading:{},cache:new Map()};
function loadPack(id){ if(!VO.loading[id])VO.loading[id]=fetch(`voice/${id}.json`).then(r=>r.ok?r.json():{}).catch(()=>({})).then(j=>(VO.packs[id]=j)); return VO.loading[id]; }
function loadVoices(){ loadPack('core'); const li=LV_INDEX[S.level]??0; LEVELS.forEach((L,i)=>{ if(L.ready&&i<=li)loadPack(L.id); }); }
function clip(t){ for(const k in VO.packs){ const v=VO.packs[k][t]; if(v)return v; } return null; }
let sayTok=0, voSrc=null, voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)); voice=vs.find(v=>/premium|enhanced|natural|neural|online/i.test(v.name))||vs[0]||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function tts(t){ return new Promise(res=>{ try{ const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=.95; if(voice)u.voice=voice; u.onend=()=>res(true); u.onerror=()=>res(false); speechSynthesis.speak(u); setTimeout(()=>res(true),1500+t.length*180);}catch(e){res(false)} }); }
function stopVoice(){ sayTok++; try{voSrc&&voSrc.stop()}catch(e){} voSrc=null; try{speechSynthesis.cancel()}catch(e){} }
function say(...parts){ parts=parts.flat().filter(Boolean).map(String); stopVoice(); return playLines(parts,sayTok); }
async function playLines(parts,tok){
  for(let i=0;i<parts.length;i++){
    if(tok!==sayTok)return false; const t=parts[i], b=clip(t), a=AC();
    if(!b||!a){ const r=await tts(parts.slice(i).join(' ')); return r&&tok===sayTok; }
    let buf=VO.cache.get(t); if(!buf){ buf=await decode(b); if(buf){ VO.cache.set(t,buf); if(VO.cache.size>80)VO.cache.delete(VO.cache.keys().next().value); } }
    if(tok!==sayTok)return false; if(!buf){ const r=await tts(parts.slice(i).join(' ')); return r&&tok===sayTok; }
    await new Promise(res=>{ const s=a.createBufferSource(), g=a.createGain(); s.buffer=buf; g.gain.value=1.2; s.connect(g); g.connect(a.destination); s.onended=res; voSrc=s; s.start(); });
  }
  return tok===sayTok;
}

const storyLine=s=>s.replace(/\s*\([^)]*\)/g,'');
function voiceLines(){
  const out={core:new Set(LINES)}; LEVELS.forEach(L=>{ if(L.ready)out[L.id]=new Set(); });
  PRAISE.forEach(p=>out.core.add(p)); for(let s=0;s<=100;s+=5)out.core.add(`${s}점!`);
  LEVELS.forEach(L=>out.core.add(lvLine(L)));
  const names=[...MONSTERS.map(m=>m[1]),...WORLDS.flatMap(W=>[...W.mons.map(m=>m[1]),W.boss[1]])];
  names.forEach(n=>{ out.core.add(`${n}${josaIG(n)} 나타났다!`); out.core.add(`야호! ${n}${josa(n)} 물리쳤어!`); });
  WORLDS.forEach(W=>out.core.add(`보스를 물리쳤다! ${W.gear.n}${josa(W.gear.n)} 얻었어!`));
  Object.values(ITEMS).forEach(it=>out.core.add(it.n+'!'));
  CH.forEach(o=>{ out[o.lv].add(o.he); if(o.book){ const k='s'+o.lv; (out[k]=out[k]||new Set()); o.book.pages.forEach(t=>out[k].add(storyLine(t))); } });
  WORDS.forEach(w=>{ const lv=[...w.w].map(c=>BY[c].lv).sort((a,b)=>LV_INDEX[b]-LV_INDEX[a])[0]; out[lv].add(w.r); });
  return Object.fromEntries(Object.entries(out).map(([k,v])=>[k,[...v]]));
}

let BK=null, bkWriter=null;
function openBook(c){
  const o=BY[c]; if(!o.book)return openCard(c);
  BK={c,p:0,tok:0,auto:true};
  loadPack('s'+o.lv);
  $('#bkTitle').textContent=`${o.he} 이야기`;
  $('#book').hidden=false; document.body.style.overflow='hidden';
  if(!S.seen[c]){ S.seen[c]=1; addStars(1); toast('새 스티커! ⭐ +1'); sparkle(); }
  bump('cards'); save();
  showPage(0);
}
function closeBook(){ if(!BK)return; BK.tok++; BK=null; stopVoice(); if(bkWriter){try{bkWriter.cancelQuiz?.()}catch(e){} bkWriter=null;} $('#book').hidden=true; document.body.style.overflow=''; if(cur==='learn')renderLearn(); }
function showPage(p){
  if(!BK)return; const o=BY[BK.c], B4=o.book, tok=++BK.tok; BK.p=p; stopVoice(); bkWriter=null;
  const art=$('#bkArt'), txt=$('#bkText');
  $('#bkDots').innerHTML=[0,1,2,3].map(i=>`<i class="${i===p?'on':''}"></i>`).join('');
  $('#bkPrev').disabled=p===0; $('#bkNext').disabled=p===3;
  if(p<3){
    const scene=(SCENES[B4.scene]||SCENES.sky)();
    art.innerHTML=`<svg class="bk-svg ${p===2?'dim':''}" viewBox="0 0 400 240">${scene}${p===1?glyphSVG(BK.c,'bk-ghost'):''}</svg>${p===2?`<div class="bk-reveal"><div class="bk-wr" id="bkWr"></div><div class="bk-he">${o.he}</div></div>`:''}`;
    txt.innerHTML=`<span class="bk-step">${['옛날 옛적에','모양을 찾아봐요','한자가 태어났어요'][p]}</span><p class="${p===0?'drop':''}">${B4.pages[p]}</p>`;
    if(p===2&&typeof HanziWriter!=='undefined'){ const box=$('#bkWr'), size=Math.floor(box.clientWidth||170);
      bkWriter=HanziWriter.create(box,BK.c,{width:size,height:size,padding:6,showCharacter:false,showOutline:true,strokeColor:'#1D2A48',outlineColor:'#E4E9F0',strokeAnimationSpeed:.9,delayBetweenStrokes:260,charDataLoader:(ch,done)=>done(STROKES[ch])});
      setTimeout(()=>{ if(BK&&tok===BK.tok&&bkWriter)bkWriter.animateCharacter({onComplete:()=>{ if(BK&&tok===BK.tok){ sparkle(); $('#bkArt .bk-he')?.classList.add('on'); } }}); },500); }
  }else{
    const ws=WORDS.filter(w=>w.w.includes(BK.c)).slice(0,5);
    art.innerHTML=`<div class="bk-card"><div class="bighan">${BK.c}</div><div class="mhe">${o.he}</div></div>`;
    txt.innerHTML=`<span class="bk-step">한자 카드</span>${ws.length?`<div class="words">${ws.map(w=>`<button class="wchip" data-say="${w.r}"><b>${w.w}</b>${w.r}</button>`).join('')}</div>`:''}
      <div class="row"><button class="btn sun" data-say="${o.he}">🔊 듣기</button><button class="btn leaf" data-write="${BK.c}">✍️ 써 보기</button><button class="btn" id="bkAgain">📖 처음부터</button></div>`;
  }
  const pg=$('#bkPage'); pg.getAnimations?.().forEach(a=>a.cancel());
  pg.animate?.([{transform:'perspective(900px) rotateY(-14deg) translateX(24px)',opacity:.2},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,.8,.3,1)'});
  if(p>0)sfx('flip',{vol:.6});
  narrate(tok);
}
async function narrate(tok){
  if(!BK)return; const o=BY[BK.c], p=BK.p;
  await Promise.race([loadPack('s'+o.lv),sleep(3000)]);
  if(!BK||tok!==BK.tok)return;
  const ok = p<3 ? await say(storyLine(o.book.pages[p])) : await say(o.he);
  if(!BK||tok!==BK.tok||!ok)return;
  if(BK.auto&&p<2){ await sleep(p===1?1200:900); if(BK&&tok===BK.tok)showPage(p+1); }
}
(()=>{ // 넘기기: 버튼 + 손가락으로 밀기
  let x0=null; const pg=document.getElementById('bkPage');
  pg.addEventListener('pointerdown',e=>{ if(e.target.closest('button'))return; x0=e.clientX; });
  pg.addEventListener('pointerup',e=>{ if(x0==null||!BK)return; const dx=e.clientX-x0; x0=null; if(dx<-60&&BK.p<3)showPage(BK.p+1); else if(dx>60&&BK.p>0)showPage(BK.p-1); });
})();

function readOpts(w){
  const set=new Set([w.r]), eums=[...new Set(pool().map(o=>o.eum))];
  const same=poolWords().filter(x=>x.r.length===w.r.length&&x.r!==w.r).map(x=>x.r);
  let guard=0;
  while(set.size<4&&guard++<200){
    if(Math.random()<.75||!same.length){ const a=[...w.r]; const i=Math.floor(Math.random()*a.length); a[i]=pick(eums); set.add(a.join('')); }
    else set.add(pick(same));
  }
  return shuffle([...set]).map(r=>({label:r,correct:r===w.r}));
}
function heOpts(o,P){ const others=sample(P.filter(x=>x.c!==o.c&&x.he!==o.he),3); return shuffle([o,...others]); }
function qHun(c,P){ const o=BY[c]; return {kind:'훈음',chars:[c],ask:'다음 한자의 뜻과 음을 고르세요.',html:`<div class="tag">뜻과 음 고르기</div><div class="bighan">${c}</div>`,speak:'이 한자의 뜻과 음은 뭘까?',sayAns:o.he,optClass:'',options:heOpts(o,P).map(x=>({label:x.he,correct:x.c===c})),answer:o.he,show:c}; }
function qFind(c,P){ const o=BY[c]; return {kind:'한자 찾기',chars:[c],ask:'뜻과 음에 맞는 한자를 고르세요.',html:`<div class="tag">한자 찾기</div><button class="sayq" data-say="${o.he}" aria-label="다시 듣기">🔊</button><div class="bighe">${o.he}</div>`,speak:['찾아라!',o.he],sayAns:o.he,optClass:'han',options:heOpts(o,P).map(x=>({label:x.c,correct:x.c===c})),answer:c,show:o.he}; }
function qRead(w){ return {kind:'독음',chars:[...w.w],ask:'다음 한자어의 읽는 소리를 고르세요.',html:`<div class="tag">소리 내어 읽기</div><div class="bigword">${w.w}</div>`,speak:'이 낱말은 어떻게 읽을까?',sayAns:w.r,optClass:'',options:readOpts(w),answer:w.r,show:w.w}; }
function qAnt(p,P){ const [a,b]=Math.random()<.5?[p[0],p[1]]:[p[1],p[0]]; const others=sample(P.filter(x=>x.c!==a&&x.c!==b),3).map(x=>x.c);
  return {kind:'반대말',chars:[a,b],ask:`'${a}'와 뜻이 반대되는 한자를 고르세요.`,html:`<div class="tag">반대말 찾기</div><div class="bighan">${a}</div><div class="small">${BY[a].he} ↔ ?</div>`,speak:['반대말을 찾아라!',BY[a].he],optClass:'han',options:shuffle([b,...others]).map(x=>({label:x,correct:x===b})),answer:`${b} (${BY[b].he})`,sayAns:BY[b].he,show:a}; }
const STROKE_SAFE=['山','大','木','王','土','日','月','中','小','三','白','上','下','工','口','川','天','文','立','千'];
function strokeSVG(c,idx){ const d=STROKES[c]; return `<svg class="strokesvg" viewBox="0 0 1024 1024" role="img" aria-label="${c} 필순"><g transform="scale(1,-1) translate(0,-900)">${d.strokes.map((p,i)=>`<path d="${p}" style="fill:${i===idx?'var(--seal)':'var(--ink)'}"/>`).join('')}</g></svg>`; }
function qStroke(c){ const n=STROKES[c].strokes.length, idx=Math.floor(Math.random()*n); const max=Math.max(n,4);
  let nums=new Set([idx+1]); while(nums.size<4)nums.add(1+Math.floor(Math.random()*max));
  return {kind:'필순',chars:[c],ask:'빨간 획은 몇 번째로 쓰나요?',html:`<div class="tag">획순 (모두 ${n}획)</div><div>${strokeSVG(c,idx)}</div>`,speak:'빨간 획은 몇 번째로 쓸까?',optClass:'',options:[...nums].sort((a,b)=>a-b).map(k=>({label:k+'번째',correct:k===idx+1})),answer:(idx+1)+'번째',show:c}; }

function makeQFrom(cs0,recent,allowAnt){
  const P=pool(), fresh=cs0.filter(c=>!recent.includes(c)), cs=fresh.length?fresh:cs0;
  const ws=poolWords().filter(w=>[...w.w].some(c=>cs.includes(c)));
  const ants=allowAnt?poolAnts().filter(p=>cs0.includes(p[0])||cs0.includes(p[1])):[];
  const kinds=['hun','hun','find','find']; if(ws.length)kinds.push('read','read'); if(ants.length)kinds.push('ant');
  const t=pick(kinds);
  if(t==='read'){ const c=wpick(cs.filter(c=>ws.some(w=>w.w.includes(c)))); return qRead(pick(ws.filter(w=>w.w.includes(c)))); }
  if(t==='ant') return qAnt(pick(ants),P);
  const c=wpick(cs); return t==='hun'?qHun(c,P):qFind(c,P);
}
function makeQ(recent){ return makeQFrom(pool().map(o=>o.c),recent,S.level!=='8'); }

const MONSTERS=[['👾','뿅뿅이'],['👻','유령 부우'],['🐙','먹물 문어'],['🦖','티라노 킹'],['🤖','로봇 깡깡'],['🦑','오징어 박사'],['👹','도깨비 대장'],['🐲','한자 드래곤']];
const PRAISE=['정답!','최고야!','잘했어!','멋져!','대단해!','딩동댕!'];
let Q=null;
function startQuiz(){ const m=MONSTERS[S.rounds%MONSTERS.length]; Q={i:0,n:10,hp:10,m,first:true,earned:0,recent:[],lock:false};
  $('#monster').textContent=m[0]; $('#monName').textContent=m[1]; $('#qCheer').textContent=''; drawHP(); nextQ(); }
function drawHP(){ $('#hp').innerHTML=Array.from({length:Q.n},(_,i)=>`<i class="${i<Q.hp?'on':''}"></i>`).join(''); }
function nextQ(){
  if(Q.hp<=0)return winQuiz();
  Q.first=true; Q.lock=false; const q=makeQ(Q.recent); Q.q=q; Q.recent=[...Q.recent,...q.chars].slice(-10);
  $('#qNum').textContent=`${Q.i+1} / ${Q.n}`; $('#qPrompt').innerHTML=q.html; $('#qCheer').textContent='';
  $('#qOpts').innerHTML=q.options.map((op,k)=>`<button class="opt ${q.optClass}" data-qk="${k}">${op.label}</button>`).join('');
  say(q.speak);
}
function answerQuiz(btn){
  if(Q.lock||btn.disabled)return; const op=Q.q.options[+btn.dataset.qk];
  if(op.correct){
    Q.lock=true; btn.classList.add('right'); sGood();
    if(Q.first){ record(Q.q.chars,true); addStars(1); Q.earned++; }
    Q.hp--; Q.i++; drawHP();
    const m=$('#monster'); m.classList.remove('hit'); void m.offsetWidth; m.classList.add('hit');
    const p=pick(PRAISE); $('#qCheer').textContent=`${p} 💥`; say(p,Q.q.sayAns||Q.q.answer);
    save(); setTimeout(nextQ,1500);
  }else{
    if(Q.first){ record(Q.q.chars,false); Q.first=false; }
    btn.classList.add('wrong'); btn.disabled=true; sBad(); $('#qCheer').textContent='다시 해볼까? 💪'; say('다시 해볼까?'); save();
  }
}
function winQuiz(){
  S.rounds++; if(!S.monsters.includes(Q.m[0]))S.monsters.push(Q.m[0]); addStars(2); bump('quiz'); save();
  sWin(); confetti(); say(`야호! ${Q.m[1]}${josa(Q.m[1])} 물리쳤어!`);
  openModal(`<div class="result-big">${Q.m[0]}</div><div class="result-title">${Q.m[1]}${josa(Q.m[1])} 물리쳤어요!</div>
    <p class="story">한 번에 맞힌 문제 ${Q.earned}개 · ⭐ ${Q.earned+2}개 받았어요</p>
    <div class="row"><button class="btn grape" data-go="quiz">한 판 더!</button><button class="btn" data-go="home">처음으로</button></div>`);
}

/* ================= 짝 맞추기 ================= */
let M=null;
function startMatch(){
  const picks=wsample(pool().map(o=>o.c),6);
  const cards=shuffle(picks.flatMap(c=>[{c,k:'h'},{c,k:'m'}]));
  M={cards,open:[],done:0,t0:Date.now(),lock:false,tries:0};
  $('#mGrid').innerHTML=cards.map((d,i)=>{const o=BY[d.c];return `<button class="mcard" data-mi="${i}" aria-label="카드"><div class="in"><div class="bk">?</div>${d.k==='h'?`<div class="fc h">${d.c}</div>`:`<div class="fc m"><span class="e">${o.pic}</span>${o.he}</div>`}</div></button>`}).join('');
  $('#mTime').textContent='0';
  M.timer=setInterval(()=>{$('#mTime').textContent=Math.floor((Date.now()-M.t0)/1000)},500);
  cleanup=()=>clearInterval(M.timer);
  say('한자와 뜻을 짝지어 보자!');
}
function flipMatch(btn){
  const i=+btn.dataset.mi; if(M.lock||btn.classList.contains('open')||btn.classList.contains('ok'))return;
  btn.classList.add('open'); M.open.push(i); sfx('flip',{vol:.7});
  if(M.open.length<2)return;
  const [a,b]=M.open, A=M.cards[a], B=M.cards[b], els=document.querySelectorAll('.mcard'); M.tries++;
  if(A.c===B.c&&A.k!==B.k){
    M.open=[]; [a,b].forEach(j=>{els[j].classList.remove('open');els[j].classList.add('ok')}); sGood(); say(BY[A.c].he); record([A.c],true); M.done++;
    if(M.done===6)setTimeout(winMatch,700);
  }else{
    M.lock=true; setTimeout(()=>{[a,b].forEach(j=>els[j].classList.remove('open'));M.open=[];M.lock=false},950); tone([300],.12,'sine',.15);
  }
}
function winMatch(){
  clearInterval(M.timer); const sec=Math.floor((Date.now()-M.t0)/1000); const best=S.bestMatch==null||sec<S.bestMatch; if(best)S.bestMatch=sec;
  addStars(3); save(); sWin(); confetti(); say(best?'새 기록이야! 최고!':'다 맞췄어! 잘했어!');
  openModal(`<div class="result-big">🧩</div><div class="result-title">${sec}초 만에 다 맞췄어요!</div>
    <p class="story">${best?'🏆 새 기록!':`최고 기록 ${S.bestMatch}초`} · ⭐ 3개</p>
    <div class="row"><button class="btn sun" data-go="match">한 판 더!</button><button class="btn" data-go="home">처음으로</button></div>`);
}

/* ================= 따라 쓰기 ================= */
let W={c:null}, writer=null;
function nextWriteChar(){ const P=pool().map(o=>o.c); const un=P.filter(c=>!S.written[c]); return un.length?(un.find(c=>BY[c].lv===S.level)||un[0]):wpick(P); }
function startWrite(c){ if(!c||!poolSet().has(c))c=(W.c&&poolSet().has(W.c))?W.c:nextWriteChar(); renderStrip(c); loadWriter(c); }
function renderStrip(c){
  $('#wStrip').innerHTML=pool().map(o=>`<button class="sch ${o.c===c?'cur':''}" data-wc="${o.c}">${o.c}<small>${S.written[o.c]?'★'.repeat(S.written[o.c]):''}</small></button>`).join('');
  const el=document.querySelector('.sch.cur'); if(el)el.scrollIntoView({block:'nearest',inline:'center'});
}
function loadWriter(c){
  W={c}; const o=BY[c], box=$('#wBox'); box.innerHTML='';
  $('#wHan').textContent=c; $('#wHe').textContent=o.he; $('#wCnt').textContent=`모두 ${STROKES[c].strokes.length}획`; $('#wStar').textContent=S.written[c]?'최고 '+'⭐'.repeat(S.written[c]):'';
  if(typeof HanziWriter==='undefined'){ box.innerHTML='<p class="story" style="padding:20px">인터넷에 연결하면 따라 쓰기를 할 수 있어요.</p>'; return; }
  const size=Math.floor(box.clientWidth||320);
  writer=HanziWriter.create(box,c,{width:size,height:size,padding:Math.round(size*.06),showCharacter:false,showOutline:true,
    strokeColor:'#1D2A48',outlineColor:'#D3E1EF',drawingColor:'#D93A2B',highlightColor:'#FFC12E',drawingWidth:Math.max(20,size/12),
    strokeAnimationSpeed:1,delayBetweenStrokes:300,charDataLoader:(ch,done)=>done(STROKES[ch])});
  say(o.he,'따라 써 보자!'); quizW();
}
function quizW(){
  const c=W.c;
  writer.quiz({showHintAfterMisses:2,highlightOnComplete:true,
    onCorrectStroke:()=>tone([700],.06,'triangle',.12),
    onMistake:()=>tone([260],.08,'sine',.12),
    onComplete:d=>{ const m=d.totalMistakes, st=m===0?3:m<=2?2:1;
      S.written[c]=Math.max(S.written[c]||0,st); addStars(st); bump('write'); save();
      $('#wStar').textContent='⭐'.repeat(st)+' 잘 썼어요!'; renderStrip(c); sWin(); if(st===3)confetti();
      say(st===3?'완벽해! 별 세 개!':st===2?'잘 썼어! 별 두 개!':'끝까지 잘 썼어!'); }});
}

/* ================= 시험 연습 ================= */
let E=null;
function startExam(){
  const P=pool(), cs=P.map(o=>o.c), ws=poolWords(), ants=poolAnts(), qs=[];
  const is8=S.level==='8';
  const nRead=8, nHun=is8?8:7, nAnt=is8?0:1;
  sample(ws,nRead).forEach(w=>qs.push(qRead(w)));
  wsample(cs,nHun).forEach(c=>qs.push(qHun(c,P)));
  wsample(cs,2).forEach(c=>qs.push(qFind(c,P)));
  sample(ants,nAnt).forEach(p=>qs.push(qAnt(p,P)));
  sample(STROKE_SAFE.filter(c=>poolSet().has(c)),2).forEach(c=>qs.push(qStroke(c)));
  E={qs,i:0,ans:[],lock:false}; showE();
}
const NUM=['①','②','③','④'];
function showE(){
  const q=E.qs[E.i]; E.lock=false;
  $('#examBody').innerHTML=`<div class="eprog"><i style="width:${E.i/E.qs.length*100}%"></i></div>
    <div class="small">${E.i+1}번 / ${E.qs.length}문제</div><div class="esec">[${q.kind}] ${q.ask}</div>
    <div class="prompt">${q.html.replace(/<div class="tag">.*?<\/div>/,'')}</div>
    <div class="opts">${q.options.map((op,k)=>`<button class="opt ${q.optClass}" data-ek="${k}"><span class="no">${NUM[k]}</span>${op.label}</button>`).join('')}</div>`;
  if(q.kind==='한자 찾기')say(q.show);
}
function answerExam(btn){
  if(E.lock)return; E.lock=true; const q=E.qs[E.i], ok=q.options[+btn.dataset.ek].correct;
  E.ans.push(ok); record(q.chars,ok); btn.classList.add('right'); tone([520],.08,'triangle',.12);
  setTimeout(()=>{ E.i++; E.i<E.qs.length?showE():endExam(); },350);
}
function endExam(){
  const n=E.qs.length, ok=E.ans.filter(Boolean).length, score=Math.round(ok/n*100), pass=score>=70;
  const earned=Math.round(ok/2)+(pass?5:0); addStars(earned);
  S.exams.push({d:todayKey(),lv:S.level,score}); S.exams=S.exams.slice(-30); save();
  if(pass){sWin();confetti()} say(`${score}점!`,pass?'합격이야! 정말 잘했어!':'괜찮아, 틀린 것만 다시 보면 돼!');
  const wrong=E.qs.filter((q,i)=>!E.ans[i]);
  $('#examBody').innerHTML=`<div class="panel" style="text-align:center">
    <div class="stamp ${pass?'':'fail'}">${pass?'合格':'다시<br>도전'}</div>
    <div class="result-title">${lvName()} 모의시험 ${score}점</div>
    <p class="small">${n}문제 중 ${ok}개 맞음 · 70점 이상이면 합격 · ⭐ ${earned}개</p>
    ${wrong.length?`<div class="review">${wrong.map(q=>`<div><b>${q.show}</b>[${q.kind}] 정답: ${q.answer}</div>`).join('')}</div>`:'<p class="story">하나도 안 틀렸어요! 🎉</p>'}
    <div class="row"><button class="btn seal" data-go="exam">다시 풀기</button><button class="btn" data-go="home">처음으로</button></div></div>`;
}

/* ================= 한자 모험 (RPG) =================
   세계 5개 × (몬스터 3 + 보스 1). 몬스터 힘 게이지가 차기 전에 맞혀야 공격! */
const GROUPS={
  num:'一二三四五六七八九十百千萬',
  nature:'山水木火土日月金江川林草花天地空海春夏秋冬夕氣電靑白色',
  people:'人父母兄弟女男子夫祖老孝王民家姓名心手足口面自主',
  dir:'東西南北上下左右前後內外中出入方大小長少',
  life:'學校敎室先生文字語話問答歌算數記紙旗事物工市場道車食住活休'
};
const WORLDS=[
  {name:'숫자 숲',bg:['#C9EDB8','#6DBE69'],g:'num',mons:[['🐛','꿈틀 애벌레'],['🐌','느림보 달팽이'],['🦔','따끔 고슴도치']],boss:['🦍','킹콩 대장'],gear:{id:'boots',e:'👢',n:'바람 신발',d:'몬스터 힘이 천천히 차요'},hp:5,dur:16},
  {name:'자연 계곡',bg:['#C6EAF7','#4FA8C9'],g:'nature',mons:[['🐸','개굴 왕눈이'],['🦎','날쌘 도마뱀'],['🐍','쉭쉭 뱀']],boss:['🐊','악어 장군'],gear:{id:'sword1',e:'🗡️',n:'강철 검',d:'공격력 +1'},hp:6,dur:15},
  {name:'도깨비 마을',bg:['#F6DDBE','#D0894C'],g:'people',mons:[['👻','장난 유령'],['👺','빨간 도깨비'],['🧟','흐느적 좀비']],boss:['👹','도깨비 대장'],gear:{id:'ring',e:'💍',n:'생명 반지',d:'하트 +1'},hp:7,dur:14},
  {name:'파도 바다',bg:['#CFE0FB','#3F70D2'],g:'dir',mons:[['🦀','집게 꽃게'],['🐡','뾰족 복어'],['🦈','이빨 상어']],boss:['🐙','대왕 문어'],gear:{id:'sword2',e:'⚔️',n:'빛의 검',d:'공격력 +1'},hp:8,dur:13},
  {name:'마왕성',bg:['#D3C7EE','#4B3B8F'],g:'all',mons:[['🦇','박쥐 경비병'],['💀','해골 기사'],['🐉','검은 용']],boss:['😈','한자 마왕'],gear:{id:'crown',e:'👑',n:'용사의 왕관',d:'한자 마왕을 물리친 증거'},hp:9,dur:12},
];
const ITEMS={potion:{e:'🧪',n:'회복 물약',d:'하트 2개 회복'},shield:{e:'🛡️',n:'방패',d:'공격 한 번 막기'},scroll:{e:'📜',n:'힌트 두루마리',d:'틀린 답 2개 지우기'},hour:{e:'⏳',n:'모래시계',d:'10초 동안 몬스터 멈춤'}};
function adv(){ if(!S.adv)S.adv={cleared:{},items:{potion:2,shield:1,scroll:1,hour:1},gear:[]}; return S.adv; }
const hasGear=id=>adv().gear.includes(id);
const gearInfo=id=>WORLDS.find(W=>W.gear.id===id).gear;
const maxHearts=()=>5+(hasGear('ring')?1:0);
const swordBonus=()=>(hasGear('sword1')?1:0)+(hasGear('sword2')?1:0);
const skey=(w,s)=>w+'-'+s;
function unlocked(w,s){ if(w===0&&s===0)return true; return s>0?!!adv().cleared[skey(w,s-1)]:!!adv().cleared[skey(w-1,3)]; }
function advProgress(){ const A=adv(); let w=0; while(w<WORLDS.length&&A.cleared[skey(w,3)])w++; return w; }
function worldChars(w){
  const ps=poolSet(); let cs=WORLDS[w].g==='all'?[...ps]:[...GROUPS[WORLDS[w].g]].filter(c=>ps.has(c));
  if(cs.length<8){ const rest=[...ps].filter(c=>!cs.includes(c)); cs=cs.concat(wsample(rest,8-cs.length)); }
  return cs;
}

/* ---- 모험 지도: 아래 출발 → 위 마왕성, 구불구불한 길 ---- */
const MAP_W=400, REG_H=340;
function mapLayout(){
  const H=REG_H*WORLDS.length+60, pts=[{x:200,y:H-26}];
  WORLDS.forEach((W,w)=>{ const base=H-60-w*REG_H, flip=w%2===1, last=w===WORLDS.length-1;
    const xs=[110,290,115,last?200:255], dys=[60,140,215,last?272:292];
    xs.forEach((x,i)=>pts.push({x:flip&&!(last&&i===3)?MAP_W-x:x,y:base-dys[i]})); });
  return {H,pts};

const FX={parts:[],arcs:[],run:false};
function fxCtx(){ const c=$('#bFx'), r=$('#bField').getBoundingClientRect(), d=window.devicePixelRatio||1;
  const W=Math.round(r.width*d), H=Math.round(r.height*d); if(c.width!==W||c.height!==H){c.width=W;c.height=H;}
  const x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0); return x; }
function fxStart(){
  if(FX.run)return; FX.run=true; let last=performance.now();
  const step=now=>{
    const dt=Math.min(50,now-last)/1000; last=now; const ctx=fxCtx(), c=$('#bFx'); ctx.clearRect(0,0,c.width,c.height);
    FX.parts=FX.parts.filter(p=>(p.life-=dt)>0);
    for(const p of FX.parts){ p.vx*=.9; p.vy=p.vy*.9+p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; const a=p.life/p.max;
      ctx.globalAlpha=Math.min(1,a*1.4); ctx.strokeStyle=p.c; ctx.lineWidth=p.w*a+.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04); ctx.stroke(); }
    FX.arcs=FX.arcs.filter(a=>(a.t+=dt)<a.dur);
    for(const a of FX.arcs)drawArc(ctx,a);
    ctx.globalAlpha=1;
    if(FX.parts.length||FX.arcs.length)requestAnimationFrame(step); else {FX.run=false; ctx.clearRect(0,0,c.width,c.height);}
  };
  requestAnimationFrame(step);
}
function sparks(x,y,n,colors,speed=560){ for(let i=0;i<n;i++){ const an=Math.random()*Math.PI*2, sp=speed*(.35+Math.random()); const life=.25+Math.random()*.35;
  FX.parts.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-120,g:1400,life,max:life,c:pick(colors),w:2.5+Math.random()*3.5}); } fxStart(); }
function slashFx(x,y,r,angle,color,dur=.26){ FX.arcs.push({k:'cres',x,y,r,angle,color,dur,t:0}); fxStart(); }
function ringFx(x,y,r,color,dur=.35){ FX.arcs.push({k:'ring',x,y,r,color,dur,t:0}); fxStart(); }
function clawFx(x,y){ [-22,0,22].forEach((o,i)=>FX.arcs.push({k:'line',x:x+o,y,len:70,angle:.5,color:'#E2372A',dur:.4,t:-i*.04})); fxStart(); }
function drawArc(ctx,a){
  if(a.t<0)return; const p=a.t/a.dur; ctx.save(); ctx.translate(a.x,a.y);
  if(a.k==='cres'){ const sw=Math.min(1,p*3), fade=1-Math.max(0,(p-.35)/.65); ctx.rotate(a.angle); ctx.globalAlpha=fade;
    const s=-1.25, e=s+2.5*sw; ctx.shadowColor=a.color; ctx.shadowBlur=24; ctx.fillStyle='#FFFFFF';
    ctx.beginPath(); ctx.arc(0,0,a.r,s,e); ctx.arc(a.r*.16,0,a.r*.86,e,s,true); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=fade*.6; ctx.fillStyle=a.color; ctx.beginPath(); ctx.arc(0,0,a.r*1.06,s,e); ctx.arc(a.r*.1,0,a.r*.98,e,s,true); ctx.closePath(); ctx.fill(); }
  else if(a.k==='ring'){ ctx.globalAlpha=1-p; ctx.strokeStyle=a.color; ctx.lineWidth=10*(1-p)+1; ctx.beginPath(); ctx.arc(0,0,a.r*(.3+p),0,Math.PI*2); ctx.stroke(); }
  else if(a.k==='line'){ const g=Math.min(1,p*4), fade=1-Math.max(0,(p-.4)/.6); ctx.rotate(a.angle); ctx.globalAlpha=fade; ctx.strokeStyle=a.color; ctx.lineCap='round';
    ctx.lineWidth=9; ctx.shadowColor=a.color; ctx.shadowBlur=10; ctx.beginPath(); ctx.moveTo(-a.len/2,0); ctx.lineTo(-a.len/2+a.len*g,0); ctx.stroke(); }
  ctx.restore();
}

  const nx=B.s<3?[B.w,B.s+1]:[B.w+1,0];
  const msg=B.boss?`보스를 물리쳤어요! '${WORLDS[B.w+1].name}'이 열렸어요!`:`${B.m[1]}${josa(B.m[1])} 물리쳤어요!`;
  say(B.boss?(gear?`보스를 물리쳤다! ${gear.n}${josa(gear.n)} 얻었어!`:'보스를 물리쳤다!'):'물리쳤다! 보물 상자를 열어 볼까?'); sfx('chest',{vol:.7,delay:.2}); sfx('coins',{vol:.7,delay:.7});
  openModal(`<div class="chest">🎁</div><div class="result-title">${msg}</div>${lootHtml}
    <div class="row"><button class="btn grape" data-battle="${nx[0]},${nx[1]}">다음 싸움 ➡</button><button class="btn" data-go="adv">지도 보기</button></div>`);
}
function loseBattle(){
  cancelAnimationFrame(rafId); const A=adv(); A.items.potion=(A.items.potion||0)+1; save();
  say('앗, 쓰러졌어. 괜찮아! 물약을 줄게. 다시 도전하자!');
  openModal(`<div class="result-big">💫</div><div class="result-title">앗, 쓰러졌어요!</div>
    <p class="story">괜찮아요! 🧪 회복 물약 1개를 줄게요.<br>물약은 싸울 때 아래 버튼을 눌러 쓸 수 있어요.</p>
    <div class="row"><button class="btn seal" data-battle="${B.w},${B.s}">다시 도전!</button><button class="btn" data-go="adv">지도 보기</button></div>`);
}

/* ================= 부모님 화면 ================= */
let resetArm=false;
function renderParent(){
  resetArm=false;
  const P=pool(); let r=0,w=0; P.forEach(o=>{const s=S.stat[o.c];if(s){r+=s.r;w+=s.w}});
  const weak=P.filter(o=>S.stat[o.c]&&S.stat[o.c].w>0).sort((a,b)=>{const A=S.stat[a.c],B=S.stat[b.c];return (B.w/(B.r+B.w))-(A.w/(A.r+A.w))||B.w-A.w}).slice(0,12);
  const ex=S.exams.filter(e=>e.lv===S.level).slice(-5);
  $('#scr-parent').innerHTML=`
    <div class="kpis">
      <div class="kpi">모은 별<b>⭐ ${S.stars}</b></div>
      <div class="kpi">본 카드 (${lvName()})<b>${P.filter(o=>S.seen[o.c]).length}/${P.length}</b></div>
      <div class="kpi">퀴즈 정답률<b>${r+w?Math.round(r/(r+w)*100)+'%':'—'}</b></div>
      <div class="kpi">따라 쓴 글자<b>${P.filter(o=>S.written[o.c]).length}/${P.length}</b></div>
    </div>
    <div class="panel"><h3 style="margin-top:0">최근 모의시험 (${lvName()})</h3><p>${ex.length?ex.map(e=>`${e.d}: <b>${e.score}점</b>`).join(' · '):'아직 기록이 없어요.'}</p></div>
    <div class="panel"><h3 style="margin-top:0">자주 틀리는 한자</h3>
      ${weak.length?`<div class="ptable">${weak.map(o=>{const s=S.stat[o.c];return `<div class="pc bad"><span class="han">${o.c}</span>${o.he}<br><span>맞음 ${s.r} · 틀림 ${s.w}</span></div>`}).join('')}</div><p class="small">퀴즈와 시험에서 이 한자들이 더 자주 나오도록 자동으로 조절돼요.</p>`:'<p>아직 틀린 한자가 없어요.</p>'}</div>
    <div class="panel"><h3 style="margin-top:0">한자별 기록 (${lvName()}까지)</h3>
      <div class="ptable">${P.map(o=>{const s=S.stat[o.c]||{r:0,w:0},t=s.r+s.w,acc=t?s.r/t:null;const cls=acc==null?'':acc>=.85?'good':acc>=.6?'mid':'bad';return `<div class="pc ${cls}"><span class="han">${o.c}</span>${o.he}<br><span>${t?`${s.r}/${t}`:'—'}${S.written[o.c]?' · ✍️':''}</span></div>`}).join('')}</div></div>
    <div class="panel ptxt">
      <h3>알아 두세요</h3>
      한국어문회 한자능력검정시험 기준이에요. 실제 시험은 독음과 훈음을 <b>한글로 직접 써서</b> 답하니까, 앱에서 익힌 뒤 종이에 써 보는 연습도 같이 해 주세요.<br>
      따라 쓰기의 획순 데이터는 중국 표준을 바탕으로 해서 일부 한자는 우리나라 획순과 다를 수 있어요. 필순 문제는 획순이 같은 한자로만 냈어요.<br>
      기록은 이 태블릿의 브라우저에만 저장돼요.
      <h3>이름</h3><button class="btn" id="renameBtn">이름 바꾸기 (지금: ${esc(heroName())})</button>
      <h3>기록 지우기</h3>
      <button class="btn seal" id="resetBtn">모든 기록 지우기</button>
    </div>`;
}
function doReset(btn){
  if(!resetArm){ resetArm=true; btn.textContent='정말 지울까요? 한 번 더 누르세요'; return; }
  const lv=S.level; S={stars:0,seen:{},stat:{},written:{},monsters:[],rounds:0,bestMatch:null,level:lv,day:null,today:{cards:0,quiz:0,write:0,bonus:false},exams:[]};
  save(); toast('기록을 지웠어요'); go('home');
}

/* ================= 이벤트 ================= */
document.addEventListener('click',e=>{
  const nd=e.target.closest('[data-node]'); if(nd&&!e.target.closest('button')){ const [w,s]=nd.dataset.node.split(',').map(Number); openNode(w,s); return; }
  const t=e.target.closest('button'); if(!t)return;
  if(t.dataset.close){ closeModal(); return; }
  if(t.dataset.say!==undefined){ say(t.dataset.say); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.write){ go('write',t.dataset.write); return; }
  if(t.dataset.card){ openBook(t.dataset.card); return; }
  if(t.id==='bkClose'){ closeBook(); return; }
  if(t.id==='bkPrev'&&BK&&BK.p>0){ BK.auto=false; showPage(BK.p-1); return; }
  if(t.id==='bkNext'&&BK&&BK.p<3){ showPage(BK.p+1); return; }
  if(t.id==='bkSay'&&BK){ narrate(++BK.tok); return; }
  if(t.id==='bkAgain'&&BK){ BK.auto=true; showPage(0); return; }
  if(t.dataset.qk!==undefined){ answerQuiz(t); return; }
  if(t.dataset.mi!==undefined){ flipMatch(t); return; }
  if(t.dataset.wc){ renderStrip(t.dataset.wc); loadWriter(t.dataset.wc); return; }
  if(t.dataset.ek!==undefined){ answerExam(t); return; }
  if(t.dataset.lv){ const L=LEVELS.find(x=>x.id===t.dataset.lv);
    if(!L.ready){ toast(`${L.name}은 초등학교 가서 열어요 🔒`); return; }
    S.level=L.id; save(); renderHome(); toast(`${L.name} 모드!`); say(lvLine(L)); loadVoices();; return; }
  if(t.dataset.bk!==undefined){ answerBattle(t); return; }
  if(t.dataset.battle){ go('battle',t.dataset.battle.split(',').map(Number)); return; }
  if(t.dataset.item){ useItem(t.dataset.item); return; }
  if(t.id==='bSpecial'){ startSpecial(); return; }
  if(t.id==='backBtn'){ go(cur==='battle'?'adv':'home'); return; }
  if(t.id==='mClose'){ closeModal(); return; }
  if(t.id==='wAnim'&&writer){ writer.cancelQuiz(); writer.animateCharacter({onComplete:()=>{ setTimeout(()=>{writer.hideCharacter();quizW()},500) }}); return; }
  if(t.id==='wRetry'&&W.c){ loadWriter(W.c); return; }
  if(t.id==='wNext'){ const P=pool().map(o=>o.c); const i=P.indexOf(W.c); const c=P[(i+1)%P.length]; renderStrip(c); loadWriter(c); return; }
  if(t.id==='resetBtn'){ doReset(t); return; }
  if(t.id==='renameBtn'){ askName(false); return; }
});
document.addEventListener('submit',e=>{ if(e.target.id!=='nameForm')return; e.preventDefault();
  const v=$('#nameIn').value.trim().replace(/\s+/g,' ').slice(0,8); S.name=v||'용사'; save(); closeModal(true); sparkle(); go(cur==='parent'?'parent':'home'); });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal')closeModal(); });

/* 부모님 화면: 1.5초 꾹 누르기 */
(()=>{ const b=$('#parentBtn'); let tm=null;
  const start=e=>{ e.preventDefault(); b.classList.add('hold'); tm=setTimeout(()=>{ b.classList.remove('hold'); go('parent'); },1500); };
  const stop=()=>{ clearTimeout(tm); b.classList.remove('hold'); };
  b.addEventListener('pointerdown',start); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('contextmenu',e=>e.preventDefault());
})();

if(!LEVELS.find(L=>L.id===S.level&&L.ready))S.level='8';
loadVoices(); renderTop(); go('home'); if(!S.name)askName(true);
</script>
